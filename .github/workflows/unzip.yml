name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -q AutoTube.zip -d /tmp/x
          rm AutoTube.zip
          rm -rf /tmp/x/AutoTube/.github
          cp -a /tmp/x/AutoTube/. .
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project"
          git push
